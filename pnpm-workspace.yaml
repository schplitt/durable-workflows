catalogMode: prefer

minimumReleaseAgeExclude:
  - '@iso4/*'

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - cached-factory@0.1.0
  - ts-api-utils@2.2.0
  - undici-types@6.21.0

packages:
  - 'packages/*'

catalog:
  '@changesets/cli': ^3.0.3
  '@iso4/fetch': ^0.1.1
  '@iso4/sandbox': ^0.9.0
  '@schplitt/eslint-config': ^1.5.4
  '@types/node': ^26.6.6
  eslint: ^10.14.0
  tsdown: ^0.23.5
  tsnapi: ^1.6.1
  typescript: ^6.0.3
  vitest: ^5.1.0

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
