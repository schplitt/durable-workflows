catalogMode: prefer

minimumReleaseAgeExclude:
  - '@iso4/*'

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - cached-factory@0.1.0
  - ts-api-utils@2.2.0
  - undici-types@6.21.0

packages:
  - 'packages/*'

catalog:
  '@changesets/cli': ^2.31.1
  '@iso4/fetch': ^0.0.1
  '@iso4/sandbox': ^0.4.1
  '@schplitt/eslint-config': ^1.5.3
  '@types/node': ^24.12.4
  eslint: ^10.8.0
  tsdown: ^0.22.14
  tsnapi: ^1.2.0
  typescript: ^6.0.3
  vitest: ^4.1.10

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
