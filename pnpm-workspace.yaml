catalogMode: prefer

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - cached-factory@0.1.0
  - ts-api-utils@2.2.0
  - undici-types@6.21.0

packages:
  - 'packages/*'

catalog:
  '@changesets/cli': ^2.27.10
  '@iso4/sandbox': ^0.0.4
  '@schplitt/eslint-config': ^1.5.1
  eslint: ^10.5.0
  tsdown: ^0.21.10
  typescript: ^6.0.3
  vitest: ^4.1.9

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
