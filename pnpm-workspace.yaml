catalogMode: prefer

minimumReleaseAgeExclude:
  - '@iso4/*'

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - cached-factory@0.1.0
  - ts-api-utils@2.2.0
  - undici-types@6.21.0

packages:
  - 'packages/*'

catalog:
  '@changesets/cli': ^2.27.10
  '@iso4/fetch': ^0.0.1
  '@iso4/sandbox': ^0.2.2
  '@schplitt/eslint-config': ^1.5.1
  '@types/node': ^24.12.4
  eslint: ^10.5.0
  tsdown: ^0.21.10
  tsnapi: ^1.0.0
  typescript: ^6.0.3
  vitest: ^4.1.9

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
